[workspace]

members = [
    "minimax",
    "cc_common",
    "network_model_nc",
    # "network_model_z3",
    "network_model_nc_qe_output",
    "network_model_bursty_qe_output",
    "ds"
, "abr_common", "network_model_c"]
resolver = "2"

# Exact arithmetic is `Ratio<i32>`: an overflow must stop the run, not wrap
# silently and corrupt the history (and every belief after it).
[profile.release]
overflow-checks = true
